<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gurung Trial Viewer</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Gurung stimuli</p>
        <h1>Experimental trial viewer</h1>
      </div>
      <div class="toolbar" aria-label="Viewer controls">
        <label class="search">
          <span>Search</span>
          <input id="search" type="search" autocomplete="off" placeholder="Dataset, verb, object">
        </label>
        <label class="filter">
          <span>Filter</span>
          <select id="filter">
            <option value="all">All datasets</option>
            <option value="full-sets">All 4 sets ready</option>
            <option value="set-incomplete">Visible set incomplete</option>
            <option value="core-incomplete">Core images incomplete</option>
            <option value="needs-endings">Needs endings</option>
            <option value="empty-set">Empty visible set</option>
            <option value="existing-problems">Set 1 problems</option>
            <option value="extras">Extra images</option>
          </select>
        </label>
        <fieldset class="set-controls" aria-label="Visible sets">
          <legend>Sets</legend>
          <label class="control-option"><input type="checkbox" data-set-toggle value="1" checked> 1</label>
          <label class="control-option"><input type="checkbox" data-set-toggle value="2" checked> 2</label>
          <label class="control-option"><input type="checkbox" data-set-toggle value="3"> 3</label>
          <label class="control-option"><input type="checkbox" data-set-toggle value="4"> 4</label>
        </fieldset>
        <fieldset class="view-control" aria-label="Image set previews">
          <legend>Images</legend>
          <label class="control-option"><input id="show-image-sets" type="checkbox" checked> Sets</label>
          <span class="radio-cluster" role="radiogroup" aria-label="Image set size">
            <label class="control-option"><input type="radio" name="image-set-size" value="5" checked> 5</label>
            <label class="control-option"><input type="radio" name="image-set-size" value="8"> 8</label>
          </span>
        </fieldset>
        <fieldset class="view-control" aria-label="Path preview visibility">
          <legend>Paths</legend>
          <label class="control-option"><input id="show-path-previews" type="checkbox" checked> Show</label>
        </fieldset>
        <button id="refresh" class="primary" type="button">Refresh</button>
      </div>
    </header>

    <section id="status" class="status" aria-live="polite"></section>

    <div class="workspace">
      <nav id="dataset-nav" class="dataset-nav" aria-label="Datasets"></nav>
      <main id="datasets" class="datasets" aria-live="polite">
        <div class="empty-state">Loading trials...</div>
      </main>
    </div>

    <div id="lightbox" class="lightbox" hidden>
      <button class="lightbox-backdrop" type="button" aria-label="Close image preview"></button>
      <figure class="lightbox-panel">
        <img id="lightbox-image" alt="">
        <figcaption id="lightbox-caption"></figcaption>
      </figure>
      <section id="review-panel" class="review-panel" aria-labelledby="review-title" hidden>
        <div class="review-panel-header">
          <p class="eyebrow">Picture reviews</p>
          <h2 id="review-title">Picture</h2>
        </div>
        <div id="review-list" class="review-list"></div>
        <textarea id="review-text" rows="5" maxlength="3000" placeholder="Write a comment for this picture."></textarea>
        <p id="review-status" class="review-status" aria-live="polite"></p>
        <button id="review-save" class="primary" type="button">Save comment</button>
      </section>
    </div>

    <div id="idea-modal" class="idea-modal" hidden>
      <button class="modal-backdrop" type="button" aria-label="Close idea editor"></button>
      <section class="idea-panel" aria-labelledby="idea-title">
        <div class="idea-header">
          <div>
            <p class="eyebrow">Missing picture idea</p>
            <h2 id="idea-title">Dataset</h2>
          </div>
          <button id="idea-close" class="icon-button" type="button" aria-label="Close idea editor">x</button>
        </div>
        <textarea id="idea-text" rows="9" maxlength="5000" placeholder="Write a prompt, scene note, or visual idea for this missing picture."></textarea>
        <p id="idea-status" class="idea-status" aria-live="polite"></p>
        <div class="idea-actions">
          <button id="idea-clear" class="secondary" type="button">Clear</button>
          <button id="idea-cancel" class="secondary" type="button">Cancel</button>
          <button id="idea-save" class="primary" type="button">Save</button>
        </div>
      </section>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
